name: Frontend Build CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
      - "main.tf"
      - "variables.tf"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "frontend/**"
      - "main.tf"
      - "variables.tf"

env:
  AWS_REGION: us-east-1
  S3_BUCKET: number-acidizer-web-host-2026

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-node-${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::415221474531:role/plasmics-demo
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist/ s3://number-acidizer-web-host-2026
