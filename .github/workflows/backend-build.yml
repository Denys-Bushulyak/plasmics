name: Backend Build CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
      - "main.tf"
      - "variables.tf"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - "main.tf"
      - "variables.tf"

env:
  ECR_REPOSITORY: number-acidizer-backend
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::415221474531:role/plasmics-demo
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}/{1}:develop', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image URI output
        id: image-uri
        run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Image URI (Main)
        if: github.ref == 'refs/heads/main'
        run: echo "Production image pushed to ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Image URI (Develop)
        if: github.ref == 'refs/heads/develop'
        run: echo "Development image pushed to ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:develop"

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_name=number-acidizer" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="project_name=number-acidizer" \
            -auto-approve \
            tfplan

      - name: Update Lambda function image
        run: |
          aws lambda update-function-code \
            --function-name number-acidizer-api \
            --image-uri ${{ needs.docker-build-and-push.outputs.image-uri }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name number-acidizer-api \
            --region ${{ env.AWS_REGION }}

      - name: Terraform Output
        run: terraform output

      - name: Deployment complete
        run: |
          echo "Backend deployed successfully!"
          echo "API Gateway URL: https://$(aws api-gateway get-rest-apis --region ${{ env.AWS_REGION }} --query 'items[0].id' --output text).execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
