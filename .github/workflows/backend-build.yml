name: Backend Build CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
      - "main.tf"
      - "variables.tf"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - "main.tf"
      - "variables.tf"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          audience: sts.amazonaws.com
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::415221474531:role/plasmics-demo

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
